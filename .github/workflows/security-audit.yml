name: Security Audit

# Runs separately from ci.yml (not on every push/PR) so it can't block merges on
# already-known, currently-unfixable transitive vulnerabilities (see the accepted-risk
# note below) — it exists purely to surface *new* high/critical advisories as they land.

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch: {}

jobs:
  audit-server:
    name: npm audit — server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # Known accepted-risk findings as of 2026-08-03 (no fix available upstream):
      # adm-zip (via @huggingface/transformers -> onnxruntime-node), sharp (same chain),
      # xlsx (2 advisories). scripts/audit-check.mjs fails only on high/critical
      # advisories NOT in this allowlist, so new findings still break the build.
      - run: |
          node ../scripts/audit-check.mjs \
            "GHSA-xcpc-8h2w-3j85,GHSA-f88m-g3jw-g9cj,GHSA-4r6h-8v6p-xvw6,GHSA-5pgg-2g8v-p4x9"

  audit-client:
    name: npm audit — client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # react-router-dom bumped to ^7.18.2 on 2026-08-17 (tech-debt audit remediation),
      # which resolved the two moderate open-redirect/constructor-injection advisories
      # previously accepted here — 0 vulnerabilities as of that date, no allowlist needed.
      - run: npm audit --audit-level=high
